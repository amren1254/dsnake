name: Sync Instagram Posts & Deploy to Vercel

on:
  # Run automatically every 24 hours at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger at any time from GitHub Actions UI
  workflow_dispatch:
    inputs:
      username:
        description: 'Instagram username to sync (without @)'
        required: false
        default: 'ooniverse_2404'
      force_deploy:
        description: 'Force Vercel deploy even if no new posts'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-and-deploy:
    name: Fetch Instagram & Update Vercel
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📸 Fetch Instagram Posts & Update JSON
        id: sync_posts
        env:
          INSTAGRAM_USERNAME: ${{ github.event.inputs.username || 'ooniverse_2404' }}
          INSTAGRAM_SESSION_ID: ${{ secrets.INSTAGRAM_SESSION_ID }}
        run: |
          node scripts/sync-instagram.js

      - name: 🔍 Check for File Changes
        id: git_status
        run: |
          git status --porcelain
          if [[ -n $(git status --porcelain data/instagram_posts.json public/instagram/) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Found changes in instagram_posts.json or media assets."
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes in instagram_posts.json or media assets."
          fi

      - name: 💾 Commit & Push New Posts
        if: steps.git_status.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/instagram_posts.json public/instagram/
          
          # Extract username from input or default
          IG_USER="${{ github.event.inputs.username || 'ooniverse_2404' }}"
          git commit -m "chore(instagram): sync latest posts from @${IG_USER} [skip ci]"
          
          # Push to the current branch
          git push origin ${{ github.ref_name }}

      - name: 🚀 Trigger Vercel Build (Deploy Hook)
        if: steps.git_status.outputs.has_changes == 'true' || github.event.inputs.force_deploy == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "Triggering Vercel build via Deploy Hook..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK_URL")
            HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
            echo "Deploy Hook HTTP response: $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "✅ Vercel build triggered successfully via Deploy Hook!"
            else
              echo "⚠️ Deploy Hook returned status $HTTP_CODE: $RESPONSE"
            fi
          else
            echo "ℹ️ VERCEL_DEPLOY_HOOK_URL secret not set."
            echo "Note: If your repository is connected to Vercel via GitHub, the git push in the previous step has automatically triggered a production build on Vercel!"
          fi

      - name: 📋 Summary Report
        run: |
          echo "### 📸 Instagram Sync & Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile:** @${{ github.event.inputs.username || 'ooniverse_2404' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Changes Detected:** ${{ steps.git_status.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.git_status.outputs.has_changes }}" = "true" ]; then
            echo "- **Action:** Committed updated posts & triggered Vercel deployment." >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Action:** Database already up to date. No rebuild needed." >> $GITHUB_STEP_SUMMARY
          fi
